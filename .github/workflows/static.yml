name: Build and deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build with Eleventy
        run: npm run build

      - name: Copy static assets
        run: |
          cp -a css js images assets admin data ID archive resources sheets banner ssc2021 report fonts vendor sb_images _site/
          cp -a CNAME .htaccess _site/

      - name: Verify production assets
        run: |
          set -u
          missing=0
          for file in \
            _site/images/SN_Logo_Circular.png \
            _site/images/ieee-hyderabad-sac-logo.png \
            _site/images/hero.png \
            _site/js/modern-site.js
          do
            if [ -f "$file" ]; then
              echo "found: $file"
            else
              echo "missing: $file"
              missing=1
            fi
          done

          echo "Top-level _site/images files:"
          find _site/images -maxdepth 1 -type f | sort | head -50 || true

          echo "Top-level _site/js files:"
          find _site/js -maxdepth 1 -type f | sort || true

          exit "$missing"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
